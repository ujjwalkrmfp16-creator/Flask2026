{% extends 'base.html' %}

{% block title %}
Home
{% endblock title %}

{% block body %}

<!-- Update TODO -->
<div class="container my-3">

    <h3>Update TODO</h3>

    <form action="/update/{{todo.sno}}" method="POST">

        <div class="mb-3">

            <label for="title" class="form-label">
                Todo Title
            </label>

            <input type="text"
                   class="form-control"
                   name="title"
                   id="title"
                   value="{{todo.title}}"
                   required>

        </div>


        <div class="mb-3">

            <label for="desc" class="form-label">
                Todo Description
            </label>

            <input type="text"
                   class="form-control"
                   name="desc"
                   id="desc"
                   value="{{todo.desc}}"
                   required>

        </div>


        <button type="submit" class="btn btn-dark">
            Update
        </button>

    </form>

</div>

{% endblock body %}
